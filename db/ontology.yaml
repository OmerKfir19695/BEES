  - octanoic acid
  - decanoic acid
  - dodecanoic acid
  - tetradecanoic acid
  # Acyl-CoA form can match fatty acid reactions
  - hexanoyl-CoA  
  - octanoyl-CoA  
  - decanoyl-CoA  
  - dodecanoyl-CoA  
  - tetradecanoyl-CoA  

a long-chain fatty acid:
  - palmitate
  - stearate
  - oleate
  - linoleate
  - palmitic acid
  - stearic acid
  - oleic acid
  - linoleic acid
  # Acyl-CoA form can match fatty acid reactions
