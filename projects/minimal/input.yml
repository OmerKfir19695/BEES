# Minimal BEES project: first 3 glycolysis steps (Hexokinase -> PGI -> PFK).
project: MinimalBEESProject
project_directory: projects/minimal

species:
  - label: beta-D-glucose
    concentration: 1
    smiles: C([C@@H]1[C@H]([C@@H]([C@H]([C@@H](O1)O)O)O)O)O
    reactive: true
  - label: ATP
    concentration: 5.0
    smiles: C1=NC(=C2C(=N1)N(C=N2)[C@H]3[C@@H]([C@@H]([C@H](O3)COP(=O)(O)OP(=O)(O)OP(=O)(O)O)O)O)N
    reactive: true
  - label: H2O
    concentration: 55.5
    smiles: O
    reactive: false

enzymes:
  - label: Hexokinase
    concentration: 1e-3
    ecnumber: EC 2.7.1.1
    reactive: true
    amino_acid_sequence: 

  - label: Glucose-6-phosphate isomerase
    concentration: 1e-3
    ecnumber: EC 5.3.1.9
    reactive: true
    amino_acid_sequence: 

  - label: Phosphofructokinase
    concentration: 5.0e-04
    ecnumber: EC 2.7.1.11
    reactive: true
    amino_acid_sequence: 

environment:
  temperature: 310.0
  pH: 7.4

database:
  name: db

settings:
  end_time: 1000.0
  simulation_mode: iterative
  time_step: 2.0
  toleranceMoveToCore: 0.01
  toleranceKeepInEdge: 1.0e-09
  toleranceInterruptSimulation: 0.1
  max_iterations: 15

  estimate_kinetics: true
  kinetics_estimator: catpred
  kinetics_include_sd: false

  save_simulation_profiles: true
  save_ode_equations: true
  saveEdgeSpecies: true
  verbose: 20
