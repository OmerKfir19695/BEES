# Glycolysis — single reusable BEES input (species, enzymes, environment, database).
# Default `settings` below: longer run (end_time 1000 s, max_iterations 50).
# For a shorter debug loop, replace the entire `settings:` block with the commented
# template at the bottom of this file.

