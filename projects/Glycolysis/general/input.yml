environment:
  temperature: 310.0
  pH: 7.4

database:
  name: db

settings:
  # Iterative mode 
  end_time: 1000.0
  simulation_mode: iterative
  time_step: 2.0
  toleranceMoveToCore: 0.01
  toleranceKeepInEdge: 10e-10
  toleranceInterruptSimulation: 0.01
  max_iterations: 50

  # ODE solver (speed vs accuracy)
  ode_rtol: 1.0e-06
  ode_atol: 1.0e-08
  ode_method: BDF

  # Kinetics estimation
  estimate_kinetics: true
  kinetics_estimator: catpred
  kinetics_include_sd: true

  # Output
  save_simulation_profiles: true
  save_ode_equations: true
  save_reaction_tree_plots: true
  saveEdgeSpecies: true
  verbose: 20
