# E. coli glycolysis — tuned to Chassagnole et al. 2002 (Biotechnol Bioeng 79:53)
# Initial species concentrations from Table 2 (steady-state, glucose-limited chemostat,
# 37 C, cytoplasmic pH 7.5). Reference data and rmax values:
# ../experimental/chassagnole_2002_reference.md
#
# Species names match canonical labels in db/ecoli.csv so BEES reaction matching picks
# them up directly. Enzyme amino-acid sequences are the K-12 UniProt entries from
# db/ecoli.csv (glk, pgi, pfkA, fbaA, tpiA, gapA, pgk, gpmA, eno, pykF).
#
# UNITS: all `concentration` values are in mM (BEES compares them directly to CatPred
# Km, which is mM — there is no internal unit conversion). Use the `concentration_mM`
# column of chassagnole_2002_steady_state.csv, NOT the molar column. (A previous version
# used the molar values → 1000× too dilute → every S << Km → ~zero flux.)

project: GlycolysisIterative
project_directory: projects/Glycolysis/ecoli

species:
  # --- substrate ---
  - label: D-Glucose
    concentration: 2.0                      # 2 mM glucose-pulse condition (Chassagnole Fig 4-9)
    smiles: OC[C@H]1OC(O)[C@H](O)[C@@H](O)[C@@H]1O
    reactive: true

  # --- glycolytic intermediates (Chassagnole Table 2 steady state) ---
  - label: D-glucose 6-phosphate
    concentration: 3.48
    smiles: C([C@H]([C@H]([C@@H]([C@H](C=O)O)O)O)O)OP(=O)(O)O
    reactive: true

  - label: Alpha-D-glucose 6-phosphate
    concentration: 3.48                     # same pool as G6P; declared so PGI's reactant matches
    smiles: O[C@H]1O[C@H](COP(O)(O)=O)[C@@H](O)[C@H](O)[C@H]1O
    reactive: true

  - label: beta-D-Fructose 6-phosphate
    concentration: 0.6
    smiles: OC[C@@]1(O)O[C@H](COP(O)(O)=O)[C@@H](O)[C@@H]1O
    reactive: true

  - label: beta-D-Fructose 1,6-bisphosphate
    concentration: 0.272
    smiles: O[C@H]1[C@H](O)[C@@](O)(COP(O)(O)=O)O[C@@H]1COP(O)(O)=O
    reactive: true

  - label: D-Glyceraldehyde 3-phosphate
    concentration: 0.218
    smiles: OC(COP(O)(O)=O)C=O
    reactive: true

  - label: Dihydroxyacetone phosphate
    concentration: 0.167
    smiles: OCC(=O)COP(O)(O)=O
    reactive: true

  - label: (2R)-3-phospho-glyceroyl phosphate
    concentration: 0.008                      # 1,3-BPG; very low pool
    smiles: C([C@H](C(=O)OP(=O)([O-])[O-])O)OP(=O)([O-])[O-]
    reactive: true

  - label: (2R)-3-phosphoglycerate
    concentration: 2.13
    smiles: C([C@H](C(=O)[O-])O)OP(=O)([O-])[O-]
    reactive: true

  - label: (2R)-2-phosphoglycerate
    concentration: 0.399
    smiles: O=P(O)(O)O[C@H](C(=O)O)CO
    reactive: true

  - label: phosphoenolpyruvate
    concentration: 2.67
    smiles: C=C(C(=O)O)OP(=O)(O)O
    reactive: true

  - label: Pyruvic acid
    concentration: 2.67
    smiles: CC(=O)C(O)=O
    reactive: true

  # --- cofactors ---
  - label: Adenosine triphosphate
    concentration: 4.27
    smiles: NC1=NC=NC2=C1N=CN2[C@@H]1O[C@H](COP(O)(=O)OP(O)(=O)OP(O)(O)=O)[C@@H](O)[C@H]1O
    reactive: true

  - label: ADP
    concentration: 0.595
    smiles: NC1=NC=NC2=C1N=CN2[C@@H]1O[C@H](COP(O)(=O)OP(O)(O)=O)[C@@H](O)[C@H]1O
    reactive: true

  - label: NAD
    concentration: 1.47
    smiles: NC(=O)C1=C[N+](=CC=C1)[C@@H]1O[C@H](COP(O)(=O)OP(O)(=O)OC[C@H]2O[C@H]([C@H](O)[C@@H]2O)N2C=NC3=C(N)N=CN=C23)[C@@H](O)[C@H]1O
    reactive: true

  - label: NADH
    concentration: 0.1
    smiles: NC(=O)C1=CN(C=CC1)[C@@H]1O[C@H](CO[P@](O)(=O)O[P@](O)(=O)OC[C@H]2O[C@H]([C@H](O)[C@@H]2O)N2C=NC3=C(N)N=CN=C23)[C@@H](O)[C@H]1O
    reactive: true

  - label: Phosphate
    concentration: 2.5                      # Chassagnole boundary condition
    smiles: OP(=O)(O)O
    reactive: true
    constant: true

  - label: H2O
    concentration: 55.5
    smiles: O
    reactive: false

enzymes:
  # [E] values are order-of-magnitude estimates from Schmidt 2016 / Li 2014 absolute
  # proteomics of E. coli K-12, used so any single enzyme's flux can be diagnosed
  # against Chassagnole rmax (../experimental/chassagnole_2002_vmax.csv).
  # All amino-acid sequences are the canonical K-12 entries from db/ecoli.csv.

  - label: Glucokinase
    concentration: 5.0e-4                      # ~0.5 uM (glk is low-abundance; PTS dominates in vivo)
    ecnumber: EC 2.7.1.2
    reactive: true
    amino_acid_sequence: 

  # PGI — phosphoglucose isomerase (pgi, P0A6T1)
  - label: Glucose-6-phosphate isomerase
    concentration: 5.0e-3                      # ~5 uM
    ecnumber: EC 5.3.1.9
    reactive: true
    amino_acid_sequence: 

  # PFK — phosphofructokinase-1 (pfkA, P0A796) — canonical K-12 isozyme over pfkB
  - label: Phosphofructokinase
    concentration: 4.0e-3                      # ~4 uM (pfkA)
    ecnumber: EC 2.7.1.11
    reactive: true
    amino_acid_sequence: 

  # Aldolase — fructose-bisphosphate aldolase class II (fbaA, P0AB71) — main K-12 enzyme; fbaB is gluconeogenic
  - label: Fructose-bisphosphate aldolase
    concentration: 2.5e-2                      # ~25 uM (very abundant)
    ecnumber: EC 4.1.2.13
    reactive: true
    amino_acid_sequence: 

  - label: Triosephosphate isomerase
    concentration: 1.5e-2                      # ~15 uM
    ecnumber: EC 5.3.1.1
    reactive: true
    amino_acid_sequence: MRHPLVMGNWKLNGSRHMVHELVSNLRKELAGVAGCAVAIAPPEMYIDMAKREAEGSHIMLGAQNVDLNLSGAFTGETSAAMLKDIGAQYIIIGHSERRTYHKESDELIAKKFAVLKEQGLTPVLCIGETEAENEAGKTEEVCARQIDAVLKTQGAAAFEGAVIAYEPVWAIGTGKSATPAQAQAVHKFIRDHIAKVDANIAEQVIIQYGGSVNASNAAELFAQPDIDGALVGGASLKADAFAVIVKAAEAAKQA

  - label: Glyceraldehyde-3-phosphate dehydrogenase
    concentration: 5.0e-2                      # ~50 uM (gapA is one of the most abundant cytosolic enzymes)
    ecnumber: EC 1.2.1.12
    reactive: true
    amino_acid_sequence: 

  - label: Phosphoglycerate kinase
    concentration: 1.0e-2                      # ~10 uM
    ecnumber: EC 2.7.2.3
    reactive: true
    amino_acid_sequence: 

  # Phosphoglycerate mutase — cofactor-dependent (gpmA, P62707) is the main K-12 enzyme
  - label: Phosphoglycerate mutase
    concentration: 8.0e-3                      # ~8 uM
    ecnumber: EC 5.4.2.11
    reactive: true
    amino_acid_sequence: MAVTKLVLVRHGESQWNKENRFTGWYDVDLSEKGVSEAKAAGKLLKEEGYSFDFAYTSVLKRAIHTLWNVLDELDQAWLPVEKSWKLNERHYGALQGLNKAETAEKYGDEQVKQWRRGFAVTPPELTKDDERYPGHDPRYAKLSEKELPLTESLALTIDRVIPYWNETILPRMKSGERVIIAAHGNSLRALVKYLDNMSEEEILELNIPTGVPLVYEFDENFKPLKRYYLGNADEIAAKAAAVANQGKAK

  - label: Phosphopyruvate hydratase (enolase)
    concentration: 3.0e-2                      # ~30 uM
    ecnumber: EC 4.2.1.11
    reactive: true
    amino_acid_sequence: 

  # Pyruvate kinase — pykF (P0AD61) is the FBP-activated K-12 isozyme that carries glycolytic flux; pykA is the alternate
  - label: Pyruvate kinase
    concentration: 5.0e-3                      # ~5 uM (pykF)
    ecnumber: EC 2.7.1.40
    reactive: true
    amino_acid_sequence: 

environment:
  temperature: 310.15                          # 37 C (Chassagnole)
  pH: 7.5                                      # cytoplasmic pH (Chassagnole)

database:
  name: ecoli

settings:
  # Iterative mode
  end_time: 60
  time_step: 2.0
  toleranceMoveToCore: 0.01
  toleranceKeepInEdge: 10e-10
  toleranceInterruptSimulation: 0.01
  max_iterations: 2
  # ODE solver (speed vs accuracy)
  ode_rtol: 1.0e-06
  ode_atol: 1.0e-08
  ode_method: BDF

  # Kinetics estimation
  estimate_kinetics: true
  kinetics_estimator: catpred
  kinetics_include_sd: true

  # Empirical kcat calibration — fill in after first diagnostic run against
  # ../experimental/chassagnole_2002_steady_state.csv. Same pattern as the
  # Ruppe-2020 FAS II calibration in
  # ../../fattyAcidSynthesis/fattyAcidSynthesis_ecoli/input.yml.
  # kinetics_ec_kcat_scale:
  #   "EC 2.7.1.11": 1.0   # PFK
  #   "EC 4.1.2.13": 1.0   # FBA
  #   "EC 1.2.1.12": 1.0   # GAPDH

  # Output
  save_simulation_profiles: true
  save_ode_equations: true
  save_reaction_tree_plots: true
  saveEdgeSpecies: true
  verbose: 20
